name: Build & Release

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build (Debug)
        run: dotnet build -c Debug --no-restore

      - name: Publish single-file exe (Release)
        run: |
          dotnet publish -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:PublishTrimmed=false -o publish

      - name: Compute SHA256
        shell: pwsh
        run: |
          $hash = Get-FileHash -Algorithm SHA256 -Path "publish\FocusCapture.exe"
          $hash.Hash | Out-File -Encoding ascii publish\FocusCapture.exe.sha256
          Get-Content publish\FocusCapture.exe.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FocusCapture-windows-x64
          path: publish/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: FocusCapture-windows-x64
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/FocusCapture.exe
            dist/FocusCapture.exe.sha256
          generate_release_notes: true
